<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0">
<script>
// "Lembrar neste aparelho": guarda a chave de acesso (NUNCA a senha) no próprio navegador.
// modo "ler" devolve o que está guardado ("" se nada); "gravar" guarda o valor; "apagar" limpa.
const CHAVE = 'carteiras_arp_acesso';
function enviar(tipo, extra) { window.parent.postMessage(Object.assign({isStreamlitMessage: true, type: tipo}, extra || {}), '*'); }
let ultimo = null;
window.addEventListener('message', ev => {
  const m = ev.data;
  if (!m || m.type !== 'streamlit:render') return;
  const a = m.args || {}, sinal = a.modo + '|' + (a.valor || '');
  if (sinal === ultimo) return;
  ultimo = sinal;
  let guardado = '';
  try {
    if (a.modo === 'gravar' && a.valor) localStorage.setItem(CHAVE, a.valor);
    else if (a.modo === 'apagar') localStorage.removeItem(CHAVE);
    else if (a.modo === 'ler') guardado = localStorage.getItem(CHAVE) || '';
  } catch (e) { guardado = ''; }
  if (a.modo === 'ler') enviar('streamlit:setComponentValue', {value: guardado, dataType: 'json'});
});
// Ícone do atalho na tela inicial do celular (dentinho) e nome "Carteiras".
(function icone() {
  const base = location.pathname.split('/component/')[0];
  const url = location.origin + base + '/app/static/apple-touch-icon.png';
  const docs = [];
  try { docs.push(window.top.document); } catch (e) {}
  try { if (window.parent !== window.top) docs.push(window.parent.document); } catch (e) {}
  docs.forEach(d => {
    try {
      d.querySelectorAll('link[rel="apple-touch-icon"]').forEach(l => l.remove());
      const l = d.createElement('link'); l.rel = 'apple-touch-icon'; l.href = url; d.head.appendChild(l);
      // Android/Chrome: ícone e nome do app instalado vêm do "manifest"
      const est = location.origin + base + '/app/static/';
      d.querySelectorAll('link[rel="manifest"]').forEach(l => l.remove());
      const mf = d.createElement('link'); mf.rel = 'manifest'; mf.href = est + 'manifest.json'; d.head.appendChild(mf);
      d.querySelectorAll('link[rel="icon"][sizes="192x192"]').forEach(l => l.remove());
      const ic = d.createElement('link'); ic.rel = 'icon'; ic.sizes = '192x192'; ic.href = est + 'icon-192.png'; d.head.appendChild(ic);
      let tc = d.querySelector('meta[name="theme-color"]');
      if (!tc) { tc = d.createElement('meta'); tc.name = 'theme-color'; d.head.appendChild(tc); }
      tc.content = '#534AB7';
      if (!d.querySelector('meta[name="apple-mobile-web-app-title"]')) {
        const m = d.createElement('meta'); m.name = 'apple-mobile-web-app-title'; m.content = 'Carteiras'; d.head.appendChild(m);
      }
    } catch (e) {}
  });
})();
enviar('streamlit:componentReady', {apiVersion: 1});
enviar('streamlit:setFrameHeight', {height: 0});
</script>
</body></html>
